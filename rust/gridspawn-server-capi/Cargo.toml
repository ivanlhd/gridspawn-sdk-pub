[package]
name = "gridspawn-server-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "C ABI for gridspawn-server: Gridspawn's server SDK for C, C++ and Unreal."
# Not published until a licence is chosen (see the repository README).
publish = false

[lib]
name = "gridspawn_server_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
gridspawn-server = { path = "../gridspawn-server" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
url = "2"
zeroize = "1"

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
