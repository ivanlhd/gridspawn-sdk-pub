language = "C"
include_guard = "GRIDSPAWN_SERVER_H"
autogen_warning = "/* Generated by cbindgen from rust/gridspawn-server-capi. Do not edit. */"
include_version = true
cpp_compat = true
documentation_style = "c99"
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
header = """
/*
 * Gridspawn server SDK, C ABI.
 *
 * Rules for every function:
 * - Fallible functions return GsStatus (GS_STATUS_OK = 0). Outputs are written
 *   only on success. The last parameter, GsError **error, may be NULL; on
 *   failure it receives an error to free with gs_error_free, on success NULL.
 * - Handles are opaque; each gs_*_free accepts NULL and is called once.
 *   gs_client_connect consumes the credential, also on failure.
 * - Input strings are NUL-terminated UTF-8, borrowed for the call. char **
 *   outputs belong to the caller: free them with gs_string_free (zeroized).
 *   const char * accessors are borrowed until their handle is freed.
 * - Handles may be used from any thread. Never call a blocking gs_* function
 *   from a GsPostCallback: it is refused with GS_STATUS_INVALID_ARGUMENT.
 * - Panics never cross into C (GS_STATUS_INTERNAL), as long as the library is
 *   built with panic = "unwind" (the default).
 * - Check gs_abi_version() == GS_ABI_VERSION before use.
 */"""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["GsStatus", "GsErrorCode", "GsEnvironment", "GsIdentityKind"]
